  <section class="px-8 py-7 pb-16 flex-1" id="view-library" data-view-panel>
    <div class="flex justify-between items-end mb-5">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight mb-1">Local library</h1>
        <p class="text-[13px] text-ink-2">Videos read directly from <code class="font-mono bg-inset px-1.5 py-px rounded text-[0.9em] text-grade-teal">/videos</code> on this machine, for editing speed.</p>
      </div>
      <div>
        <label class="inline-flex items-center justify-center gap-1.5 text-[13px] font-semibold px-4 py-2.5 rounded-lg cursor-pointer bg-grade-orange text-[#1a0e04] hover:bg-[#ff8b3d] transition-colors" for="file-upload-input">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2V11M8 2L4.5 5.5M8 2L11.5 5.5M3 13H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Add videos
        </label>
        <input type="file" class="hidden" id="file-upload-input" accept="video/*" multiple>
      </div>
    </div>
    <div id="upload-dropzone" class="dropzone border-2 border-dashed border-hairline rounded-2xl p-6 text-center text-ink-3 text-[13px] mb-6 transition-colors">
      <p>Drag &amp; drop video files here, or use "Add videos" above &mdash; they'll be copied straight into the local <code class="font-mono bg-inset px-1.5 py-px rounded text-[0.9em] text-grade-teal">/videos</code> folder. New here? Add a video, then click its card to open the Editor.</p>
    </div>
    <div id="library-grid" class="grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-4"></div>
  </section>
