  <section class="px-8 py-7 pb-16 hidden flex-1" id="view-logs" data-view-panel>
    <div class="flex justify-between items-end mb-5 flex-wrap gap-3">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight mb-1">Live logs</h1>
        <p class="text-[13px] text-ink-2">Real-time backend activity, streamed as it happens. <span class="status-dot" id="logs-status-dot" data-service="logs" title="Log stream"></span></p>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-ghost btn-sm" id="btn-pause-logs">Pause</button>
        <button class="btn btn-ghost btn-sm" id="btn-clear-logs">Clear</button>
      </div>
    </div>
    <div id="logs-list" class="logs-list">
      <p class="empty-hint">No logs yet.</p>
    </div>
  </section>
